[platformio]
default_envs = master_firmware

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 3.x fuehrt WiFi ueber die separate Network-Bibliothek.
; Mit deep+ greift die LDF hier falsch und verliert Network.h aus dem Build.
lib_ldf_mode = deep
build_flags =
    -D SH_PLATFORMIO=1

[env:master_firmware]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<basetypes/master_firmware/>
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient @ ^2.8

[env:net_erl]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<basetypes/net_erl/>
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

