services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_ADMIN_USER:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_ADMIN_PASSWORD:-change-me}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG:-smarthome}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET:-smarthome}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_ADMIN_TOKEN:-change-me-token}"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  nodered:
    image: nodered/node-red:3.1
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: "${INFLUXDB_ORG:-smarthome}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET:-smarthome}"
      INFLUXDB_TOKEN: "${INFLUXDB_ADMIN_TOKEN:-change-me-token}"
      SQLITE_DB_PATH: "${SQLITE_DB_PATH:-/data/sqlite/smarthome_phase1.db}"
    volumes:
      - ./nodered:/data
      - ./sqlite:/data/sqlite
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        if [ ! -d /data/node_modules/node-red-node-sqlite ]; then
          cd /data && npm install --no-audit --no-fund --unsafe-perm
        fi
        node <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const sqlite3 = require('/data/node_modules/sqlite3');
        const dbPath = process.env.SQLITE_DB_PATH || '/data/sqlite/smarthome_phase1.db';
        const schemaSql = fs.readFileSync('/data/sqlite/00_schema_phase1.sql', 'utf8');
        const dir = '/data/flows/active';
        function ensureSchema() {
          return new Promise((resolve, reject) => {
            const db = new sqlite3.Database(dbPath, (openErr) => {
              if (openErr) {
                reject(openErr);
                return;
              }

              db.exec(schemaSql, (execErr) => {
                db.close((closeErr) => {
                  if (execErr) {
                    reject(execErr);
                    return;
                  }

                  if (closeErr) {
                    reject(closeErr);
                    return;
                  }

                  resolve();
                });
              });
            });
          });
        }

        (async () => {
          await ensureSchema();
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.json')).sort();
          const merged = files.flatMap((name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8')));
          fs.writeFileSync('/data/flows.json', JSON.stringify(merged, null, 2));
          const lines = [
            "const base = require('/data/settings.js');",
            'module.exports = {',
            '  ...base,',
            '  functionGlobalContext: {',
            '    ...(base.functionGlobalContext || {}),',
            "    topicRouter: require('/data/lib/topic_router'),",
            "    deviceStore: require('/data/lib/device_store'),",
            "    topicHandlers: require('/data/lib/topic_handlers'),",
            "    capabilityHelpers: require('/data/lib/capability_helpers'),",
            "    timeHelpers: require('/data/lib/time_helpers')",
            '  }',
            '};',
            ''
          ];
          fs.writeFileSync('/tmp/settings.generated.js', lines.join('\n'));
        })().catch((error) => {
          console.error(error);
          process.exit(1);
        });
        NODE
        exec node $$NODE_OPTIONS /usr/src/node-red/node_modules/node-red/red.js --userDir /data --settings /tmp/settings.generated.js --flowFile /data/flows.json

volumes:
  influxdb-data: {}
