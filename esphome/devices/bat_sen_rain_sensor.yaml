# bat_sen_020 - Regensensor als MQTT-only Ersatzlinie

substitutions:
  node_name: bat-sen-020
  device_id: bat_sen_020
  device_name: BAT-SEN Rain
  device_class: bat_sen
  power_type: battery
  fw_version: "1"
  caps: "768"
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: sleep_event
  sensor_mask: RXXXXXXXXX
  input_mask: XXXXX
  rain_pin: GPIO3
  battery_pin: GPIO4
  rain_wet_threshold_raw: "2200"
  rain_clear_threshold_raw: "2050"
  wake_interval_s: "900"
  rx_window_ms: "5000"

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml

esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_rain_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: smarthome/device/${device_id}/internal
  discovery: false
  log_topic: null
  shutdown_message: null
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'

deep_sleep:
  id: deep_sleep_1
  run_duration: ${rx_window_ms}ms
  sleep_duration: ${wake_interval_s}s

globals:
  - id: rain_detected_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: rain_raw_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: battery_has_value
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_mv_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: battery_pct_value
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: publish_bat_rain_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            if (id(battery_has_value)) root["battery_pct"] = id(battery_pct_value); else root["battery_pct"] = nullptr;
            if (id(battery_has_value)) root["battery_mv"] = id(battery_mv_value); else root["battery_mv"] = nullptr;
            root["window_open"] = nullptr;
            root["rain_raw"] = id(rain_raw_value);
            root["button_flags"] = 0;
            root["fault"] = id(contract_fault);

sensor:
  - platform: adc
    id: rain_adc
    pin: ${rain_pin}
    update_interval: 1s
    attenuation: 12db
    on_value:
      then:
        - lambda: |-
            id(rain_raw_value) = (int) lroundf(x * 4095.0f);
            if (id(rain_raw_value) >= atoi("${rain_wet_threshold_raw}")) {
              id(rain_detected_state) = true;
            } else if (id(rain_raw_value) <= atoi("${rain_clear_threshold_raw}")) {
              id(rain_detected_state) = false;
            }
        - script.execute: publish_bat_rain_state
  - platform: adc
    id: battery_adc
    pin: ${battery_pin}
    update_interval: 1s
    attenuation: 12db
    on_value:
      then:
        - lambda: |-
            int mv = (int) lroundf(x * 1000.0f * 2.0f * 1.078f);
            int pct = (mv - 2000) * 100 / (3200 - 2000);
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(battery_mv_value) = mv;
            id(battery_pct_value) = pct;
            id(battery_has_value) = true;
        - script.execute: publish_bat_rain_state
