# bat_sen_010 - Fensterkontakt als MQTT-only Ersatzlinie

substitutions:
  node_name: bat-sen-010
  device_id: bat_sen_010
  device_name: BAT-SEN Window
  device_class: bat_sen
  power_type: battery
  fw_version: "1"
  caps: "640" # Bitmaske: BATTERY(512) | WINDOW(128)
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: sleep_event
  sensor_mask: WXXXXXXXXX # Window an Position 0, Rest unbelegt (Batterie-Sensor)
  input_mask: XXXXX
  setup_ap_password: bat-sen-setup
  setup_status_field_name: wake_interval_s
  setup_sensor_field_name: rx_window_ms
  setup_status_default: "900" # 900 s = 15 min Wake-Intervall
  setup_sensor_default: "5000" # 5000 ms = 5 s RX-Fenster nach Wake
  setup_status_min: "30"
  setup_status_max: "65535"
  setup_sensor_min: "500"
  setup_sensor_max: "60000"
  contact_pin: GPIO3
  battery_pin: GPIO4
  setup_button_pin: GPIO2
  rx_window_ms: "5000" # 5000 ms = 5 s RX-Fenster nach Wake

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml
  device_event: !include ../packages/smarthome_device_event.yaml

esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  includes:
    - ../packages/setup_portal.h
    - ../packages/smarthome_command_dispatch.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(window_open_state) = id(contact_sensor).state;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_window_state
      - script.execute: publish_boot_event
      - safe_mode.mark_successful

esp32:
  board: esp32-c3-devkitm-1
  toolchain: platformio
  framework:
    type: arduino

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT
  ap:
    ssid: ${node_name}-setup
    password: ${setup_ap_password}

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: smarthome/device/${device_id}/internal
  discovery: false
  log_topic: null
  shutdown_message: null
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  # on_connect feuert erst nach MQTT-Broker-Verbindung (nach on_boot).
  # Bei Deep-Sleep-Geraeten ist das der erste garantierte Sendezeitpunkt.
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_window_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability
  on_json_message:
    - topic: smarthome/device/${device_id}/command
      then:
        - lambda: |-
            std::string request_id;
            if (!smarthome::smarthome_extract_request_id(x, request_id)) {
              id(contract_fault) = true;
              id(contract_last_status_code) = -20;
              id(contract_last_status_text) = "missing_request_id";
              return;
            }

            std::string command = "";
            if (x["command"].is<const char*>()) {
              command = x["command"].as<std::string>();
            }

            auto queue_ack = [&](const char *status, int status_code, const char *source) {
              id(ack_request_id) = request_id;
              id(ack_status) = status;
              id(ack_status_code) = status_code;
              id(ack_source) = source;
              id(flush_command_ack).execute();
            };

            if (command == "get_state") {
              id(clear_contract_fault).execute();
              id(publish_bat_window_state).execute();
              queue_ack("ok", 0, "node_ack");
              return;
            }

            if (command == "set_config") {
              if (!x["values"].is<JsonObjectConst>()) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -21;
                id(contract_last_status_text) = "invalid_payload";
                queue_ack("invalid_payload", -21, "device_validation");
                return;
              }

              JsonObjectConst values = x["values"].as<JsonObjectConst>();
              bool changed = false;
              bool invalid = false;
              if (values["master_mac"].is<const char*>()) {
                std::string master_mac = values["master_mac"].as<std::string>();
                if (smarthome::smarthome_validate_master_mac(master_mac)) {
                  id(stored_master_mac) = master_mac;
                  id(setup_master_mac_text).publish_state(master_mac);
                  changed = true;
                } else {
                  invalid = true;
                }
              }

              if (invalid || !changed) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -21;
                id(contract_last_status_text) = "invalid_payload";
                queue_ack("invalid_payload", -21, "device_validation");
                return;
              }

              id(clear_contract_fault).execute();
              id(publish_contract_meta).execute();
              id(publish_contract_availability).execute();
              id(publish_bat_window_state).execute();
              queue_ack("ok", 0, "node_ack");
              return;
            }

            id(contract_fault) = true;
            id(contract_last_status_code) = -2;
            id(contract_last_status_text) = "unsupported";
            queue_ack("unsupported", -2, "master_validation");

deep_sleep:
  id: deep_sleep_1
  wakeup_pin:
    number: ${contact_pin}
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

globals:
  - id: window_open_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_has_value
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_mv_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: battery_pct_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: hardware_fault          # Hardware-Sensorfehler (getrennt von contract_fault)
    type: bool
    restore_value: no
    initial_value: "false"      # BAT-SEN: keine diagnostischen Sensoren, hardware_fault bleibt immer false.

script:
  - id: apply_setup_sensor_interval
    then:
      - lambda: |-
          // BAT-SEN nutzt den Wert als Deep-Sleep run_duration.

  - id: publish_bat_window_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            if (id(battery_has_value)) root["battery_pct"] = id(battery_pct_value); else root["battery_pct"] = nullptr;
            if (id(battery_has_value)) root["battery_mv"] = id(battery_mv_value); else root["battery_mv"] = nullptr;
            root["window_open"] = id(window_open_state) ? 1 : 0;  // Integer 0/1 (nicht bool), wie Firmware-Protokoll.
            root["rain_raw"] = nullptr;
            root["button_flags"] = 0;
            root["fault"] = id(hardware_fault) || id(contract_fault);

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              const uint32_t rx_window_ms = (uint32_t) id(setup_sensor_interval_number).state;
              return !id(setup_portal_active) && millis() >= rx_window_ms;
          then:
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda |-
                  return (uint32_t) id(setup_status_interval_number).state * 1000UL;

binary_sensor:
  - platform: gpio
    id: setup_button
    name: "${device_name} Setup Button"
    internal: true
    pin:
      number: ${setup_button_pin}
      mode:
        input: true
        pullup: false
        pulldown: false
    filters:
      - delayed_on: 35ms # 35 ms Entprellzeit (Button + Reed-Kontakt)
      - delayed_off: 35ms # 35 ms Entprellzeit (Button + Reed-Kontakt)
    on_press:
      then:
        - deep_sleep.prevent: deep_sleep_1
        - delay: 5s # 5 s Haltezeit Setup
        - if:
            condition:
              binary_sensor.is_on: setup_button
            then:
              - script.execute: enter_setup_portal
    on_release:
      then:
        - if:
            condition:
              lambda: 'return !id(setup_portal_active);'
            then:
              - deep_sleep.allow: deep_sleep_1
  - platform: gpio
    id: contact_sensor
    name: "${device_name} Contact"
    pin:
      number: ${contact_pin}
      allow_other_uses: true
      mode:
        input: true
        pulldown: false
        pullup: true
    filters:
      - delayed_on: 35ms # 35 ms Entprellzeit (Button + Reed-Kontakt)
      - delayed_off: 35ms # 35 ms Entprellzeit (Button + Reed-Kontakt)
    on_state:
      then:
        - lambda: 'id(window_open_state) = x;'
        - script.execute: publish_bat_window_state
        - lambda: |-
            id(event_type) = x ? 3 : 4;
            id(event_trigger) = 3;
            id(event_param1) = x ? 1 : 0;
            id(event_param2) = 0;
        - script.execute: flush_device_event

sensor:
  - platform: adc
    id: battery_adc
    pin: ${battery_pin}
    update_interval: 1s # 1 s ADC-Poll-Intervall (Batterie)
    attenuation: 12db # 12 dB Daempfung (Messbereich 0-3,3 V)
    on_value:
      then:
        - lambda: |-
            int mv = (int) lroundf(x * 1000.0f  // V in mV umrechnen
                                     * 2.0f    // Spannungsteiler 1:1 (Faktor 2)
                                     * 1.078f); // Kalibrierfaktor (empirisch ermittelt)
            int pct = (mv - 2200)      // 2200 mV = CR2032-Leerspannung
                      * 100 / (3000 - 2200); // 3000 mV = CR2032-Vollspannung
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(battery_mv_value) = mv;
            id(battery_pct_value) = pct;
            id(battery_has_value) = true;
        - script.execute: publish_bat_window_state
