substitutions:
  device_id: esp_net_erl_light_01
  device_name: ESP NET ERL Light Example
  device_class: net_erl
  power_type: mains
  fw_version: esphome-example
  caps: "1"
  meta_schema_version: "1"
  control_mode: relay_light
  config_profile: none
  reporting_mode: hybrid
  sensor_mask: XXXXXXXXXX
  input_mask: XXXXX
  relay_pin: GPIO4

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml
  relay_contract: !include ../packages/smarthome_relay_contract.yaml

esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(relay_1_state) = false;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_relay_contract_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ""
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_relay_contract_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability

switch:
  - platform: gpio
    id: relay_1_output
    name: ${device_name}
    pin: ${relay_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lambda: |-
            id(relay_1_state) = true;
        - script.execute: publish_relay_contract_state
    on_turn_off:
      then:
        - lambda: |-
            id(relay_1_state) = false;
        - script.execute: publish_relay_contract_state

interval:
  - interval: 5min
    then:
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_relay_contract_state
