substitutions:
  device_id: bat_sen_rain_01
  device_name: BAT-SEN Rain
  device_class: bat_sen
  power_type: battery
  fw_version: esphome-example
  caps: "768"
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: sleep_event
  sensor_mask: RXXXXXXXXX
  input_mask: XXXXX
  rain_pin: GPIO4
  rain_wet_threshold_raw: "2200"
  rain_clear_threshold_raw: "2050"
  wake_interval_s: "900"
  rx_window_ms: "5000"

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml

esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  comment: Batterie-Regensensor, MQTT-only, periodischer Wake, nicht hardwarevalidiert.
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_sen_contract_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ""
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'

deep_sleep:
  id: deep_sleep_1
  run_duration: ${rx_window_ms}ms
  sleep_duration: ${wake_interval_s}s

globals:
  - id: rain_detected
    type: bool
    restore_value: no
    initial_value: "false"
  - id: rain_raw
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: publish_bat_sen_contract_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["rain_detected"] = id(rain_detected);
            root["fault"] = id(contract_fault);

sensor:
  - platform: adc
    id: rain_adc
    pin: ${rain_pin}
    update_interval: 1s
    attenuation: 12db
    on_value:
      then:
        - lambda: |-
            id(rain_raw) = (int) lroundf(x * 4095.0f);
            if (id(rain_raw) > atoi("${rain_wet_threshold_raw}")) {
              id(rain_detected) = true;
            } else if (id(rain_raw) < atoi("${rain_clear_threshold_raw}")) {
              id(rain_detected) = false;
            }
        - script.execute: publish_bat_sen_contract_state
