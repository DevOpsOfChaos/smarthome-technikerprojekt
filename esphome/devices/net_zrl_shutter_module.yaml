# =============================================================================
# net_zrl_shutter_module.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – alternative MQTT-Linie
# Zweck:      MQTT-basierte Alternativ-Firmware für Smarthome-Geraete
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       devices/net_zrl_shutter_module.yaml
#
# Datei-Funktion:
#   Beispiel: Netzbetriebener Rollladen mit 2 Relais (auf/ab) und
#   zeitbasierter Positionssteuerung. Enthaelt Kalibrierungs-Unterstuetzung
#   fuer automatische Fahrzeit-Messung und prozentuale Teil-Positionierung.
#   Nutzt die Cover-Contracts aus smarthome_cover_contract.yaml.
#
# MQTT-Topics:
#   smarthome/device/{device_id}/meta         – Geraete-Metadaten
#   smarthome/device/{device_id}/availability – Online/Offline
#   smarthome/device/{device_id}/state        – Cover-Status (cover_state,
#                                                cover_position, cover_calibrated, fault)
#   smarthome/device/{device_id}/ack          – Kommando-Bestaetigung
#   smarthome/device/{device_id}/command      – Eingehende Kommandos
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-14
# Letzte Änderung: 2026-05-14
#
# Aenderungshistorie:
#   [2026-05-14] DevOpsOfChaos – Initiale Erstellung
#
# Abhaengigkeiten:
#   Importiert: smarthome_contract_base.yaml
#              smarthome_command_ack.yaml
#              smarthome_cover_contract.yaml
#   Wird importiert von: (keine – Device-Datei)
# =============================================================================

# =============================================================================
# SUBSTITUTIONS – Geraete-Pins und Konfiguration
# =============================================================================
# caps="8195" → Bit 0 (Relais) + Bit 13 (Cover)
# control_mode="cover", config_profile="cover_basic"
substitutions:
  node_name: net-zrl-020
  device_id: NET-ZRL-020
  device_name: NET-ZRL Shutter
  device_class: net_zrl
  power_type: mains
  fw_version: "1"
  caps: "8195"
  meta_schema_version: "1"
  control_mode: cover
  config_profile: cover_basic
  reporting_mode: hybrid
  sensor_mask: XXXXXXXXXX
  input_mask: XXXXX
  setup_ap_password: net-zrl-setup
  setup_status_default: "60"
  setup_sensor_default: "60"
  setup_status_min: "10"
  setup_status_max: "65535"
  setup_sensor_min: "10"
  setup_sensor_max: "65535"
  relay_up_pin: GPIO10               # bestehende Firmware: NET_ZRL_RELAY_UP_PIN
  relay_down_pin: GPIO5              # bestehende Firmware: NET_ZRL_RELAY_DOWN_PIN
  default_cover_travel_ms: "100000"
  button_up_pin: GPIO20
  button_down_pin: GPIO4
  button_stop_pin: GPIO3
  led_up_pin: GPIO6
  led_down_pin: GPIO7

# =============================================================================
# PACKAGES – Eingebundene Contract-Bausteine
# =============================================================================
packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml
  cover_contract: !include ../packages/smarthome_cover_contract.yaml

# =============================================================================
# BASIS – Basis-Konfiguration und Boot-Verhalten
# =============================================================================
esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  comment: Vertragskompatibles MQTT-Cover mit Kalibrierung und Positionssteuerung
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(cover_contract_state) = "stopped";
          if (!id(cover_contract_calibrated)) {
            id(cover_contract_travel_up_ms) = atoi("${default_cover_travel_ms}");
            id(cover_contract_travel_down_ms) = atoi("${default_cover_travel_ms}");
          }
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state

esp32:
  board: esp32-c3-devkitm-1
  toolchain: platformio
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${node_name}-setup
    password: ${setup_ap_password}

# =============================================================================
# MQTT – Verbindungsaufbau, Birth/Will, Connect/Disconnect
# =============================================================================
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: smarthome/device/${device_id}/internal
  discovery: false
  log_topic: null
  shutdown_message: null
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability

# =============================================================================
# SWITCH – Zwei GPIO-Relais (Auf/Ab) mit ALWAYS_OFF (Start immer aus)
# =============================================================================
switch:
  - platform: gpio
    id: cover_relay_up
    pin: ${relay_up_pin}
    restore_mode: ALWAYS_OFF
    name: "Cover Relay Up"
    on_turn_on:
      then:
        - switch.turn_on: cover_led_up
    on_turn_off:
      then:
        - switch.turn_off: cover_led_up
  - platform: gpio
    id: cover_relay_down
    pin: ${relay_down_pin}
    restore_mode: ALWAYS_OFF
    name: "Cover Relay Down"
    on_turn_on:
      then:
        - switch.turn_on: cover_led_down
    on_turn_off:
      then:
        - switch.turn_off: cover_led_down
  - platform: gpio
    id: cover_led_up
    pin: ${led_up_pin}
    restore_mode: ALWAYS_OFF
    name: "Cover LED Up"
    internal: true
  - platform: gpio
    id: cover_led_down
    pin: ${led_down_pin}
    restore_mode: ALWAYS_OFF
    name: "Cover LED Down"
    internal: true

binary_sensor:
  - platform: gpio
    id: cover_button_up
    name: "Cover Button Up"
    internal: true
    pin:
      number: ${button_up_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - script.execute: cover_hw_open
        - lambda: 'id(cover_contract_state) = "opening";'
        - script.execute: publish_cover_contract_state
  - platform: gpio
    id: cover_button_down
    name: "Cover Button Down"
    internal: true
    pin:
      number: ${button_down_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - lambda: |-
            id(down_button_pressed_at_ms) = millis();
            id(down_setup_hold_consumed) = false;
        - delay: 5s
        - if:
            condition:
              binary_sensor.is_on: cover_button_down
            then:
              - lambda: 'id(down_setup_hold_consumed) = true;'
              - script.execute: enter_setup_portal
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                const uint32_t pressed_at = id(down_button_pressed_at_ms);
                const uint32_t held_ms = pressed_at > 0 ? millis() - pressed_at : 0;
                const bool setup_consumed = id(down_setup_hold_consumed);
                id(down_button_pressed_at_ms) = 0;
                id(down_setup_hold_consumed) = false;
                return !setup_consumed && held_ms < 5000UL;
            then:
              - script.execute: cover_hw_close
              - lambda: 'id(cover_contract_state) = "closing";'
              - script.execute: publish_cover_contract_state
  - platform: gpio
    id: cover_button_stop
    name: "Cover Button Stop"
    internal: true
    pin:
      number: ${button_stop_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - lambda: 'id(stop_button_pressed_at_ms) = millis();'
        - script.execute: cover_hw_stop
        - lambda: 'id(cover_contract_state) = "stopped";'
        - script.execute: publish_cover_contract_state

# =============================================================================
# GLOBALE VARIABLEN – Teil-Positionierung (Partial Movement)
# =============================================================================
globals:
  - id: stop_button_pressed_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: down_button_pressed_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: down_setup_hold_consumed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_partial_active          # true = eine Teil-Positionsfahrt ist aktiv
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_partial_duration_ms     # Berechnete Fahrzeit für die aktuelle Teil-Position (ms)
    type: int
    restore_value: no
    initial_value: "0"

number:
  - platform: template
    id: setup_cover_travel_up_ms
    name: "${device_name} travel_time_up_ms"
    min_value: 1000
    max_value: 180000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_cover_travel_ms}
    internal: true
    on_value:
      then:
        - lambda: |-
            id(cover_contract_travel_up_ms) = (int)x;
            id(cover_contract_calibrated) =
              id(cover_contract_travel_up_ms) >= 1000 &&
              id(cover_contract_travel_down_ms) >= 1000;
  - platform: template
    id: setup_cover_travel_down_ms
    name: "${device_name} travel_time_down_ms"
    min_value: 1000
    max_value: 180000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_cover_travel_ms}
    internal: true
    on_value:
      then:
        - lambda: |-
            id(cover_contract_travel_down_ms) = (int)x;
            id(cover_contract_calibrated) =
              id(cover_contract_travel_up_ms) >= 1000 &&
              id(cover_contract_travel_down_ms) >= 1000;
  - platform: template
    id: setup_cover_default_travel_ms
    name: "${device_name} default_estimated_travel_time_ms"
    min_value: 1000
    max_value: 180000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_cover_travel_ms}
    internal: true

select:
  - platform: template
    id: setup_relay_up_mapping
    name: "${device_name} relay_up_mapping"
    options:
      - relay_a
      - relay_b
    optimistic: true
    restore_value: true
    initial_option: relay_a
    internal: true

# =============================================================================
# COVER – Zeitbasierte Cover-Plattform
# =============================================================================
# platform: time_based – lokale Fahrzeitsteuerung
# device_class: shutter – Wird als Rollladen klassifiziert
# open_action:   Schaltet down-Relais AUS, up-Relais EIN
# close_action:  Schaltet up-Relais AUS, down-Relais EIN
# stop_action:   Schaltet beide Relais AUS
#
# open_duration / close_duration:
#   Wenn eine Teil-Positionsfahrt aktiv ist      → partial_duration_ms
#   Wenn Kalibrier-Phase 1 (Hochfahrt-Messung)   → 180000ms (maximale Messzeit)
#   Wenn Kalibrier-Phase 3 (Runterfahrt-Messung) → 180000ms
#   Sonst                                          → gespeicherte travel_up_ms / travel_down_ms
#
# on_opened / on_closed:
#   Bei Teilfahrt:   Position = Zielposition, partial_active=false
#   Bei Vollfahrt:   Position = 100 (offen) oder 0 (geschlossen)
#   State = "stopped", Status publishen
# =============================================================================
cover:
  - platform: time_based
    id: zrl_cover
    name: "${device_name}"
    device_class: shutter
    open_action:
      - if:
          condition:
            lambda: 'return id(setup_relay_up_mapping).state == "relay_b";'
          then:
            - switch.turn_off: cover_relay_up
            - switch.turn_on: cover_relay_down
          else:
            - switch.turn_off: cover_relay_down
            - switch.turn_on: cover_relay_up
    close_action:
      - if:
          condition:
            lambda: 'return id(setup_relay_up_mapping).state == "relay_b";'
          then:
            - switch.turn_off: cover_relay_down
            - switch.turn_on: cover_relay_up
          else:
            - switch.turn_off: cover_relay_up
            - switch.turn_on: cover_relay_down
    stop_action:
      - switch.turn_off: cover_relay_up
      - switch.turn_off: cover_relay_down
    open_duration: ${default_cover_travel_ms}ms
    close_duration: ${default_cover_travel_ms}ms
    on_opened:
      then:
        - lambda: |-
            // Prueft ob eine Teilfahrt beendet wurde → Zielposition uebernehmen
            if (id(cover_partial_active)) {
              id(cover_partial_active) = false;
              // Prueft ob kalibriert → berechnete Zielposition setzen
              if (id(cover_contract_calibrated)) {
                id(cover_contract_position) = id(cover_contract_target_position);
              }
            } else {
              // Vollfahrt hoch beendet → Position 100% (ganz offen)
              // Nicht setzen wenn Kalibrier-Phase 1 (Hochfahrt-Messung laeuft)
              if (id(cover_contract_calibrated) && id(cover_calib_phase) != 1) {
                id(cover_contract_position) = 100;
              }
            }
            id(cover_contract_state) = "stopped";
        - script.execute: publish_cover_contract_state
    on_closed:
      then:
        - lambda: |-
            // Prueft ob eine Teilfahrt beendet wurde → Zielposition uebernehmen
            if (id(cover_partial_active)) {
              id(cover_partial_active) = false;
              // Prueft ob kalibriert → berechnete Zielposition setzen
              if (id(cover_contract_calibrated)) {
                id(cover_contract_position) = id(cover_contract_target_position);
              }
            } else {
              // Vollfahrt runter beendet → Position 0% (ganz geschlossen)
              // Nicht setzen wenn Kalibrier-Phase 3 (Runterfahrt-Messung laeuft)
              if (id(cover_contract_calibrated) && id(cover_calib_phase) != 3) {
                id(cover_contract_position) = 0;
              }
            }
            id(cover_contract_state) = "stopped";
        - script.execute: publish_cover_contract_state

# =============================================================================
# SKRIPTE – Hardware-Zugriff (Wrapper für Cover-Aktionen)
# =============================================================================
script:
  # cover_hw_open – Startet Aufwaertsfahrt
  #   Parameter: keine  |  Rückgabe: keine
  - id: cover_hw_open
    then:
      - cover.open: zrl_cover

  # cover_hw_close – Startet Abwaertsfahrt
  #   Parameter: keine  |  Rückgabe: keine
  - id: cover_hw_close
    then:
      - cover.close: zrl_cover

  # cover_hw_stop – Stoppt die Fahrt
  #   Setzt partial_active=false falls eine Teilfahrt unterbrochen wurde
  #   Parameter: keine  |  Rückgabe: keine
  - id: cover_hw_stop
    then:
      - cover.stop: zrl_cover
      - lambda: |-
          // Prueft ob eine Teilfahrt aktiv war → Flag zuruecksetzen
          if (id(cover_partial_active)) {
            id(cover_partial_active) = false;
          }

  # cover_hw_set_position(target_position int) – Faehrt eine Zielposition an
  #   Berechnet aus aktuelle-Position und Ziel die noetige Teil-Fahrzeit:
  #     delta_abs = |ziel - aktuell|
  #     travel_ms = travel_up_ms (bei Aufwaerts) oder travel_down_ms (bei Abwaerts)
  #     partial_ms = (travel_ms * delta_abs) / 100
  #   Minimum 500ms (kurze Rueckler verhindern)
  #   Startet open/close je nach Richtung
  #   Parameter: target_position(int) – Zielposition 0-100%
  #   Rückgabe: keine
  - id: cover_hw_set_position
    parameters:
      target_position: int
    then:
      - lambda: |-
          // Prueft ob Cover nicht kalibriert ist → Teilpositionierung nicht moeglich
          if (!id(cover_contract_calibrated)) {
            ESP_LOGW("cover", "set_position ignored: not calibrated");
            return;
          }
          id(sync_cover_position).execute();
          int current = id(cover_contract_position);
          int target = target_position;
          // Prueft ob Zielposition bereits erreicht ist → keine Aktion noetig
          if (current == target) return;

          // Berechnet absolute Abweichung zwischen Ziel- und aktueller Position
          int delta_abs = target > current ? target - current : current - target;
          // Waehlt Fahrzeit je nach Richtung (aufwaerts/abwaerts)
          int travel_ms = target > current ? id(cover_contract_travel_up_ms) : id(cover_contract_travel_down_ms);
          int partial_ms = (travel_ms * delta_abs) / 100;
          // Prueft ob berechnete Zeit unter 500ms → Minimum setzen (Ruckler vermeiden)
          if (partial_ms < 500) partial_ms = 500;

          id(cover_partial_active) = true;
          id(cover_partial_duration_ms) = partial_ms;
          id(cover_contract_target_position) = target;
      # Prueft ob Teilfahrt aktiv ist → Richtung bestimmen und Fahrt starten
      - if:
          condition:
            lambda: 'return id(cover_partial_active);'
          then:
            # Prueft ob Ziel ueber aktueller Position → aufwaerts fahren
            - if:
                condition:
                  lambda: 'return id(cover_contract_target_position) > id(cover_contract_position);'
                then:
                  - lambda: 'id(cover_contract_state) = "opening";'
                  - cover.open: zrl_cover
                else:
                  - lambda: 'id(cover_contract_state) = "closing";'
                  - cover.close: zrl_cover
            - delay: !lambda 'return id(cover_partial_duration_ms);'
            - cover.stop: zrl_cover
            - lambda: |-
                id(cover_partial_active) = false;
                id(cover_contract_position) = id(cover_contract_target_position);
                id(cover_contract_state) = "stopped";
            - script.execute: publish_cover_contract_state

# =============================================================================
# INTERVAL – Regelmaessiger Refresh aller Status-Topics (alle 5 Minuten)
# =============================================================================
interval:
  - interval: 5min
    then:
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state
