substitutions:
  device_id: esp_net_zrl_cover_01
  device_name: ESP NET ZRL Cover Example
  device_class: net_zrl
  power_type: mains
  fw_version: esphome-example
  caps: "8195"
  meta_schema_version: "1"
  control_mode: cover
  config_profile: cover_basic
  reporting_mode: hybrid
  sensor_mask: XXXXXXXXXX
  input_mask: XXXXX
  relay_up_pin: GPIO4
  relay_down_pin: GPIO5

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml
  cover_contract: !include ../packages/smarthome_cover_contract.yaml

esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  comment: Vorbereiteter Beispielpfad fuer vertragskompatible MQTT-Cover, nicht hardwarevalidiert.
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(cover_contract_state) = "stopped";
          id(cover_contract_calibrated) = false;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ""
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability

switch:
  - platform: gpio
    id: cover_relay_up
    pin: ${relay_up_pin}
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: cover_relay_down
    pin: ${relay_down_pin}
    restore_mode: ALWAYS_OFF

script:
  - id: cover_hw_open
    then:
      - switch.turn_off: cover_relay_down
      - switch.turn_on: cover_relay_up

  - id: cover_hw_close
    then:
      - switch.turn_off: cover_relay_up
      - switch.turn_on: cover_relay_down

  - id: cover_hw_stop
    then:
      - switch.turn_off: cover_relay_up
      - switch.turn_off: cover_relay_down

  - id: cover_hw_set_position
    parameters:
      target_position: int
    then:
      - logger.log:
          level: WARN
          format: "set_position=%d accepted by contract path; replace with calibrated drive logic before productive use"
          args: ["target_position"]

interval:
  - interval: 5min
    then:
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_cover_contract_state
