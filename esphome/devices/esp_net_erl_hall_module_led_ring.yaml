# NET-ERL-002 - Hall Module LED Ring als ESPHome MQTT-only Ersatzlinie

substitutions:
  node_name: net-erl-002-esphome
  device_id: NET-ERL-002
  device_name: NET-ERL Hall Module LED Ring
  device_class: net_erl
  power_type: mains
  fw_version: esphome-net-erl-led-ring
  caps: "38013"
  meta_schema_version: "1"
  control_mode: relay_light
  config_profile: hall_module_led_ring
  reporting_mode: hybrid
  sensor_mask: THPLAMXXXX
  input_mask: BXXXX
  relay_pin: GPIO10
  button_pin: GPIO6
  presence_pin: GPIO7
  led_ring_pin: GPIO8
  led_ring_count: "17"
  i2c_sda_pin: GPIO0
  i2c_scl_pin: GPIO1
  bme680_address: "0x76"
  veml7700_address: "0x10"
  ens160_address: "0x52"

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml

esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(relay_1_state) = id(relay_1_output).state;
          id(motion_state) = id(presence_input).state;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_net_erl_led_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: smarthome/device/${device_id}/esphome
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_net_erl_led_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability
  on_json_message:
    - topic: smarthome/device/${device_id}/command
      then:
        - lambda: |-
            std::string request_id = "";
            if (x.containsKey("request_id") && !x["request_id"].isNull()) {
              request_id = x["request_id"].as<std::string>();
            }
            if (request_id.empty()) {
              id(contract_fault) = true;
              id(contract_last_status_code) = -20;
              id(contract_last_status_text) = "missing_request_id";
              return;
            }

            std::string command = "";
            if (x.containsKey("command") && !x["command"].isNull()) {
              command = x["command"].as<std::string>();
            }

            auto queue_ack = [&](const char *status, int status_code, const char *source) {
              id(ack_request_id) = request_id;
              id(ack_status) = status;
              id(ack_status_code) = status_code;
              id(ack_source) = source;
              id(flush_command_ack).execute();
            };

            if (command == "get_state") {
              id(clear_contract_fault).execute();
              id(publish_net_erl_led_state).execute();
              queue_ack("ok", 0, "esphome_state");
              return;
            }

            if (command == "set_relay") {
              bool relay_value = false;
              bool relay_value_ok = false;
              if (x.containsKey("relay_1") && !x["relay_1"].isNull()) {
                if (x["relay_1"].is<bool>()) {
                  relay_value = x["relay_1"].as<bool>();
                  relay_value_ok = true;
                } else if (x["relay_1"].is<int>()) {
                  relay_value = x["relay_1"].as<int>() != 0;
                  relay_value_ok = true;
                } else if (x["relay_1"].is<const char*>()) {
                  std::string relay_text = x["relay_1"].as<std::string>();
                  if (relay_text == "true" || relay_text == "1" || relay_text == "on") {
                    relay_value = true;
                    relay_value_ok = true;
                  } else if (relay_text == "false" || relay_text == "0" || relay_text == "off") {
                    relay_value = false;
                    relay_value_ok = true;
                  }
                }
              }
              if (!relay_value_ok) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -21;
                id(contract_last_status_text) = "invalid_payload";
                queue_ack("invalid_payload", -21, "esphome_validation");
                return;
              }
              if (relay_value) {
                id(relay_1_output).turn_on();
              } else {
                id(relay_1_output).turn_off();
              }
              id(relay_1_state) = relay_value;
              id(clear_contract_fault).execute();
              id(publish_net_erl_led_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            id(contract_fault) = true;
            id(contract_last_status_code) = -2;
            id(contract_last_status_text) = "unsupported";
            queue_ack("unsupported", -2, "esphome_validation");

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

globals:
  - id: relay_1_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: motion_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: button_flags_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: button_last_action_value
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: env_has_temp
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_hum
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_pressure
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_gas
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_lux
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_air
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_temp_01c
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_hum_01pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_pressure_pa
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_gas_ohm
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_lux
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_aqi
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_tvoc_ppb
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_eco2_ppm
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: publish_net_erl_led_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["relay_1"] = id(relay_1_state);
            if (id(env_has_temp)) root["temp_01c"] = id(env_temp_01c); else root["temp_01c"] = nullptr;
            if (id(env_has_hum)) root["hum_01pct"] = id(env_hum_01pct); else root["hum_01pct"] = nullptr;
            if (id(env_has_lux)) root["lux"] = id(env_lux); else root["lux"] = nullptr;
            if (id(env_has_pressure)) root["pressure_pa"] = id(env_pressure_pa); else root["pressure_pa"] = nullptr;
            if (id(env_has_gas)) root["gas_ohm"] = id(env_gas_ohm); else root["gas_ohm"] = nullptr;
            if (id(env_has_air)) root["aqi"] = id(env_aqi); else root["aqi"] = nullptr;
            if (id(env_has_air)) root["tvoc_ppb"] = id(env_tvoc_ppb); else root["tvoc_ppb"] = nullptr;
            if (id(env_has_air)) root["eco2_ppm"] = id(env_eco2_ppm); else root["eco2_ppm"] = nullptr;
            root["motion"] = id(motion_state);
            root["presence"] = id(motion_state);
            root["button_flags"] = id(button_flags_value);
            if (id(button_last_action_value).empty()) root["button_last_action"] = nullptr; else root["button_last_action"] = id(button_last_action_value).c_str();
            root["fault"] = id(contract_fault);

switch:
  - platform: gpio
    id: relay_1_output
    name: ${device_name}
    pin: ${relay_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lambda: 'id(relay_1_state) = true;'
        - light.turn_on:
            id: led_ring_light
            brightness: 45%
            red: 100%
            green: 80%
            blue: 35%
        - script.execute: publish_net_erl_led_state
    on_turn_off:
      then:
        - lambda: 'id(relay_1_state) = false;'
        - light.turn_off: led_ring_light
        - script.execute: publish_net_erl_led_state

binary_sensor:
  - platform: gpio
    id: presence_input
    name: "${device_name} Presence"
    pin:
      number: ${presence_pin}
      mode:
        input: true
        pulldown: false
        pullup: false
    on_state:
      then:
        - lambda: 'id(motion_state) = x;'
        - script.execute: publish_net_erl_led_state
  - platform: gpio
    id: local_button
    name: "${device_name} Button"
    pin:
      number: ${button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 40ms
    on_press:
      then:
        - lambda: |-
            id(button_flags_value) = 1;
            id(button_last_action_value) = "press";
        - switch.toggle: relay_1_output
        - script.execute: publish_net_erl_led_state

light:
  - platform: esp32_rmt_led_strip
    id: led_ring_light
    name: "${device_name} LED Ring"
    pin: ${led_ring_pin}
    num_leds: ${led_ring_count}
    rgb_order: GRB
    chipset: WS2812

sensor:
  - platform: bme680
    address: ${bme680_address}
    update_interval: 10s
    temperature:
      name: "${device_name} Temperature"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_temp_01c) = (int) lroundf(x * 10.0f);
              id(env_has_temp) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_net_erl_led_state
    humidity:
      name: "${device_name} Humidity"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_hum_01pct) = (int) lroundf(x * 10.0f);
              id(env_has_hum) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_net_erl_led_state
    pressure:
      name: "${device_name} Pressure"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_pressure_pa) = (int) lroundf(x * 100.0f);
              id(env_has_pressure) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_net_erl_led_state
    gas_resistance:
      name: "${device_name} Gas Resistance"
      on_value:
        then:
          - lambda: |-
              id(env_gas_ohm) = (int) lroundf(x);
              id(env_has_gas) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_net_erl_led_state
  - platform: veml7700
    address: ${veml7700_address}
    update_interval: 10s
    ambient_light:
      name: "${device_name} Illuminance"
      on_value:
        then:
          - lambda: |-
              id(env_lux) = (int) lroundf(x);
              id(env_has_lux) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_net_erl_led_state
  - platform: ens160_i2c
    address: ${ens160_address}
    update_interval: 10s
    eco2:
      name: "${device_name} eCO2"
      on_value:
        then:
          - lambda: |-
              id(env_eco2_ppm) = (int) lroundf(x);
              id(env_has_air) = true;
          - script.execute: publish_net_erl_led_state
    tvoc:
      name: "${device_name} TVOC"
      on_value:
        then:
          - lambda: |-
              id(env_tvoc_ppb) = (int) lroundf(x);
              id(env_has_air) = true;
          - script.execute: publish_net_erl_led_state
    aqi:
      name: "${device_name} AQI"
      on_value:
        then:
          - lambda: |-
              id(env_aqi) = (int) lroundf(x);
              id(env_has_air) = true;
          - script.execute: publish_net_erl_led_state

interval:
  - interval: 5min
    then:
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_net_erl_led_state
