substitutions:
  device_id: bat_sen_window_contact_01
  device_name: BAT-SEN Window Contact
  device_class: bat_sen
  power_type: battery
  fw_version: esphome-example
  caps: "640"
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: sleep_event
  sensor_mask: WXXXXXXXXX
  input_mask: XXXXX
  contact_pin: GPIO4
  rx_window_ms: "5000"

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml

esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  comment: Batterie-Fensterkontakt, MQTT-only, GPIO-Wake bei Kontaktwechsel, nicht hardwarevalidiert.
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_sen_contract_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ""
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'

deep_sleep:
  id: deep_sleep_1
  run_duration: ${rx_window_ms}ms
  sleep_duration: 0s
  wakeup_pin:
    number: ${contact_pin}
    mode: INVERT_WAKEUP

globals:
  - id: contact_open
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: publish_bat_sen_contract_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["contact_open"] = id(contact_open);
            root["fault"] = id(contract_fault);

binary_sensor:
  - platform: gpio
    id: contact_sensor
    pin:
      number: ${contact_pin}
      mode:
        input: true
        pulldown: false
        pullup: true
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_state:
      then:
        - lambda: |-
            id(contact_open) = x;
        - script.execute: publish_bat_sen_contract_state
