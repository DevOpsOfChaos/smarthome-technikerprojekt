# bat_sen_01 - Fensterkontakt als ESPHome MQTT-only Ersatzlinie

substitutions:
  node_name: bat-sen-01-esphome
  device_id: bat_sen_01
  device_name: BAT-SEN Window
  device_class: bat_sen
  power_type: battery
  fw_version: esphome-bat-sen-window
  caps: "640"
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: sleep_event
  sensor_mask: WXXXXXXXXX
  input_mask: XXXXX
  contact_pin: GPIO3
  battery_pin: GPIO4
  rx_window_ms: "5000"

packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml

esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
          id(window_open_state) = id(contact_sensor).state;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_bat_window_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: LIGHT

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: smarthome/device/${device_id}/esphome
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'

deep_sleep:
  id: deep_sleep_1
  run_duration: ${rx_window_ms}ms
  sleep_duration: 900s
  wakeup_pin:
    number: ${contact_pin}
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

globals:
  - id: window_open_state
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_has_value
    type: bool
    restore_value: no
    initial_value: "false"
  - id: battery_mv_value
    type: int
    restore_value: no
    initial_value: "0"
  - id: battery_pct_value
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: publish_bat_window_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            if (id(battery_has_value)) root["battery_pct"] = id(battery_pct_value); else root["battery_pct"] = nullptr;
            if (id(battery_has_value)) root["battery_mv"] = id(battery_mv_value); else root["battery_mv"] = nullptr;
            root["window_open"] = id(window_open_state);
            root["rain_raw"] = nullptr;
            root["button_flags"] = 0;
            root["fault"] = id(contract_fault);

binary_sensor:
  - platform: gpio
    id: contact_sensor
    name: "${device_name} Contact"
    pin:
      number: ${contact_pin}
      allow_other_uses: true
      mode:
        input: true
        pulldown: false
        pullup: true
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_state:
      then:
        - lambda: 'id(window_open_state) = x;'
        - script.execute: publish_bat_window_state

sensor:
  - platform: adc
    id: battery_adc
    pin: ${battery_pin}
    update_interval: 1s
    attenuation: 12db
    on_value:
      then:
        - lambda: |-
            int mv = (int) lroundf(x * 1000.0f * 2.0f * 1.078f);
            int pct = (mv - 2200) * 100 / (3000 - 2200);
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(battery_mv_value) = mv;
            id(battery_pct_value) = pct;
            id(battery_has_value) = true;
        - script.execute: publish_bat_window_state
