# =============================================================================
# esp_net_sen_env_bme680.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – ESPHome-Zweitlinie
# Zweck:      MQTT-basierte Alternativ-Firmware für Smarthome-Geraete
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       esphome/devices/esp_net_sen_env_bme680.yaml
#
# Datei-Funktion:
#   Beispiel: Netzbetriebener Umweltsensor mit BME680 (Temperatur,
#   Luftfeuchte, Luftdruck, Gaswiderstand). I2C-Anbindung (Adresse 0x76).
#   Publiziert temp_01c, hum_01pct, pressure_pa, gas_ohm via MQTT.
#
# MQTT-Topics:
#   smarthome/device/{device_id}/meta         – Geraete-Metadaten
#   smarthome/device/{device_id}/availability – Online/Offline
#   smarthome/device/{device_id}/state        – Sensorwerte (temp_01c, hum_01pct,
#                                                pressure_pa, gas_ohm, fault)
#   smarthome/device/{device_id}/ack          – Kommando-Bestaetigung
#   smarthome/device/{device_id}/command      – Eingehende Kommandos (get_state)
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-14
# Letzte Änderung: 2026-05-14
#
# Aenderungshistorie:
#   [2026-05-14] DevOpsOfChaos – Initiale Erstellung
#
# Abhaengigkeiten:
#   Importiert: smarthome_contract_base.yaml
#              smarthome_command_ack.yaml
#   Wird importiert von: (keine – Device-Datei)
# =============================================================================

# =============================================================================
# SUBSTITUTIONS – Geraetespezifische Konfiguration
# =============================================================================
# caps="39" → Bit 1 (Temp) + Bit 2 (Feuchte) + Bit 3 (Druck) + Bit 4 (Gas)
# sensor_mask="THPGXXXXXX" → T=Temp, H=Feuchte, P=Druck, G=Gas (Positionen 1-4)
substitutions:
  device_id: esp_net_sen_env_bme680_01
  device_name: ESP NET SEN Env BME680
  device_class: net_sen
  power_type: mains
  fw_version: esphome-bme680
  caps: "39"
  meta_schema_version: "1"
  control_mode: none
  config_profile: none
  reporting_mode: hybrid
  sensor_mask: THPGXXXXXX
  input_mask: XXXXX

# =============================================================================
# PACKAGES – Eingebundene Contract-Bausteine
# =============================================================================
packages:
  contract_base: !include ../packages/smarthome_contract_base.yaml
  command_ack: !include ../packages/smarthome_command_ack.yaml

# =============================================================================
# I2C – Bus-Konfiguration für BME680
# =============================================================================
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

# =============================================================================
# GLOBALE VARIABLEN – Sensor-Zwischenspeicher
# =============================================================================
globals:
  - id: env_has_temp              # true = Temperatur mindestens einmal gemessen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_hum               # true = Feuchte mindestens einmal gemessen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_pressure          # true = Druck mindestens einmal gemessen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_has_gas               # true = Gaswiderstand mindestens einmal gemessen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: env_temp_01c              # Temperatur in Zehntel-Grad (z.B. 235 = 23,5°C)
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_hum_01pct             # Luftfeuchte in Zehntel-Prozent (z.B. 455 = 45,5%)
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_pressure_pa           # Luftdruck in Pascal (z.B. 101325 = 1013,25 hPa)
    type: int
    restore_value: no
    initial_value: "0"
  - id: env_gas_ohm               # Gaswiderstand in Ohm (Luftqualitaet)
    type: int
    restore_value: no
    initial_value: "0"

# =============================================================================
# SKRIPTE – Sensor-Status publishen
# =============================================================================
script:
  # publish_env_contract_state – Veroeffentlicht Sensorwerte auf .../state (retain)
  #   Sendet nur Werte, die bereits gemessen wurden (has_*-Prüfung)
  #   Topic: smarthome/device/{device_id}/state
  #   Parameter: keine  |  Rückgabe: keine
  - id: publish_env_contract_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            if (id(env_has_temp)) {
              root["temp_01c"] = id(env_temp_01c);
            }
            if (id(env_has_hum)) {
              root["hum_01pct"] = id(env_hum_01pct);
            }
            if (id(env_has_pressure)) {
              root["pressure_pa"] = id(env_pressure_pa);
            }
            if (id(env_has_gas)) {
              root["gas_ohm"] = id(env_gas_ohm);
            }
            root["fault"] = id(contract_fault);

# =============================================================================
# ESPHOME – Basis-Konfiguration und Boot-Verhalten
# =============================================================================
esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_env_contract_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ""
  birth_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"online","online":true,"power_type":"${power_type}"}'
  will_message:
    topic: smarthome/device/${device_id}/availability
    retain: true
    payload: '{"device_id":"${device_id}","availability":"offline","online":false,"power_type":"${power_type}"}'
  on_connect:
    then:
      - lambda: |-
          id(contract_online) = true;
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_env_contract_state
  on_disconnect:
    then:
      - lambda: |-
          id(contract_online) = false;
      - script.execute: publish_contract_availability
  on_json_message:
    - topic: smarthome/device/${device_id}/command
      then:
        - lambda: |-
            // request_id aus JSON extrahieren und validieren
            std::string request_id = "";
            if (x.containsKey("request_id") && !x["request_id"].isNull()) {
              request_id = x["request_id"].as<std::string>();
            }
            if (request_id.empty()) {
              id(contract_fault) = true;
              id(contract_last_status_code) = -20;
              id(contract_last_status_text) = "missing_request_id";
              ESP_LOGW("contract", "Ignoring BME680 command without request_id");
              return;
            }

            // command aus JSON extrahieren
            std::string command = "";
            if (x.containsKey("command") && !x["command"].isNull()) {
              command = x["command"].as<std::string>();
            }

            // queue_ack – Hilfsfunktion für ACK-Antwort
            auto queue_ack = [&](const char *status, int status_code, const char *source) {
              id(ack_request_id) = request_id;
              id(ack_status) = status;
              id(ack_status_code) = status_code;
              id(ack_source) = source;
              id(flush_command_ack).execute();
            };

            // "get_state" – Aktuelle Sensorwerte publishen
            if (command == "get_state") {
              id(clear_contract_fault).execute();
              id(publish_env_contract_state).execute();
              queue_ack("ok", 0, "esphome_state");
              return;
            }

            // Fallback: unbekanntes Kommando → Fehler -2
            id(contract_fault) = true;
            id(contract_last_status_code) = -2;
            id(contract_last_status_text) = "unsupported";
            queue_ack("unsupported", -2, "esphome_validation");

# =============================================================================
# SENSOR – BME680 (Temperatur, Feuchte, Druck, Gas) via I2C
# =============================================================================
# update_interval: 30s – Sensor-Abfrage-Intervall
# Temperatur:   Konvertiert float in Zehntel-Int (lroundf(x * 10.0f))
# Feuchte:      Konvertiert float in Zehntel-Int (lroundf(x * 10.0f))
# Druck:        Pascal direkt als Int (lroundf(x))
# Gaswiderstand: Ohm direkt als Int (lroundf(x))
# Bei Erfolg: has_*-Flag setzen, Fehler löschen, Status publishen
sensor:
  - platform: bme680
    address: 0x76
    update_interval: 30s
    temperature:
      id: env_temperature_sensor
      name: "${device_name} Temperature"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_temp_01c) = (int) lroundf(x * 10.0f);
              id(env_has_temp) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_env_contract_state
    humidity:
      id: env_humidity_sensor
      name: "${device_name} Humidity"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_hum_01pct) = (int) lroundf(x * 10.0f);
              id(env_has_hum) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_env_contract_state
    pressure:
      id: env_pressure_sensor
      name: "${device_name} Pressure"
      oversampling: 16x
      on_value:
        then:
          - lambda: |-
              id(env_pressure_pa) = (int) lroundf(x);
              id(env_has_pressure) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_env_contract_state
    gas_resistance:
      id: env_gas_sensor
      name: "${device_name} Gas Resistance"
      on_value:
        then:
          - lambda: |-
              id(env_gas_ohm) = (int) lroundf(x);
              id(env_has_gas) = true;
          - script.execute: clear_contract_fault
          - script.execute: publish_env_contract_state

# =============================================================================
# INTERVAL – Regelmaessiger Refresh aller Status-Topics (alle 5 Minuten)
# =============================================================================
interval:
  - interval: 5min
    then:
      - script.execute: publish_contract_meta
      - script.execute: publish_contract_availability
      - script.execute: publish_env_contract_state
