# =============================================================================
# smarthome_cover_contract.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – ESPHome-Zweitlinie
# Zweck:      MQTT-basierte Alternativ-Firmware für Smarthome-Geraete
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       esphome/packages/smarthome_cover_contract.yaml
#
# Datei-Funktion:
#   Rollladen/Jalousie-Contract mit zeitbasierter Positionssteuerung
#   und 5-Phasen-Kalibrierung. Unterstuetzt open/close/stop/set_position/
#   calibrate/clear_calibration. Arbeitet mit kalibrierten Fahrzeiten
#   und kann Teil-Positionen über prozentuale Zeitberechnung anfahren.
#
# MQTT-Topics dieses Contracts:
#   smarthome/device/{device_id}/state    – Cover-Status (cover_state, cover_position,
#                                            cover_calibrated, fault) (retain)
#   smarthome/device/{device_id}/command  – Eingehende Kommandos:
#     get_state, calibrate, clear_calibration, open, close, stop, set_position
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-14
# Letzte Änderung: 2026-05-14
#
# Aenderungshistorie:
#   [2026-05-14] DevOpsOfChaos – Initiale Erstellung
#
# Abhaengigkeiten:
#   Importiert:    smarthome_contract_base.yaml, smarthome_command_ack.yaml
#   Wird importiert von: esp_net_zrl_cover_example.yaml
# =============================================================================

# =============================================================================
# GLOBALE VARIABLEN – Cover-Zustand, Kalibrierung, Fahrzeiten
# =============================================================================
# Kalibrierungs-State-Machine (cover_calib_phase):
#   0 = Idle – nicht in Kalibrierung
#   1 = Faehrt hoch (misst Zeit bis STOP-Kommando)
#   2 = Oben angekommen – wartet auf erneutes calibrate-Kommando
#   3 = Faehrt runter (misst Zeit bis STOP-Kommando)
#   4 = Unten angekommen – wartet auf erneutes calibrate-Kommando zum Speichern
#   5 = Kalibrierung abgeschlossen und gespeichert
# =============================================================================
globals:
  - id: cover_contract_state           # Aktueller Cover-Status: "opening", "closing", "stopped"
    type: std::string
    restore_value: no
    initial_value: '"stopped"'
  - id: cover_contract_position        # Aktuelle Position in Prozent (0=geschlossen, 100=offen)
    type: int                          # Wird nur bei cover_contract_calibrated=true aktualisiert
    restore_value: no
    initial_value: "0"
  - id: cover_contract_target_position # Zielposition bei Teil-Ansteuerung (set_position)
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_contract_calibrated      # true = Kalibrierung abgeschlossen (wird im RTC-Speicher gehalten)
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cover_contract_travel_up_ms    # Gemessene Fahrzeit hoch in ms (Default: 30000 = 30s)
    type: int                          # Wird im RTC-Speicher gehalten
    restore_value: yes
    initial_value: "30000"
  - id: cover_contract_travel_down_ms  # Gemessene Fahrzeit runter in ms (Default: 30000 = 30s)
    type: int                          # Wird im RTC-Speicher gehalten
    restore_value: yes
    initial_value: "30000"
  - id: cover_calib_phase              # Aktuelle Phase der Kalibrierungs-State-Machine (0-5)
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_calib_start_ms           # Zeitstempel (millis()) beim Start einer Fahrphase
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_calib_up_measured        # true wenn Hochfahrt gemessen wurde (Phase 1→2)
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_calib_temp_up_ms         # Gemessene Zeit der Hochfahrt (Zwischenspeicher vor dem Speichern)
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_calib_temp_down_ms       # Gemessene Zeit der Runterfahrt (Zwischenspeicher vor dem Speichern)
    type: int
    restore_value: no
    initial_value: "0"

# =============================================================================
# SKRIPTE – Cover-Logik
# =============================================================================
script:
  # sync_cover_position – Synchronisiert cover_contract_position mit ESPHome-cover.position
  #   Wenn kalibriert: position = cover.position * 100 (Prozent)
  #   Parameter: keine  |  Rückgabe: keine
  - id: sync_cover_position
    then:
      - lambda: |-
          // Prueft ob Cover kalibriert ist – dann Position von ESPHome-Cover abrufen
          if (id(cover_contract_calibrated)) {
            id(cover_contract_position) = (int) lroundf(id(zrl_cover).position * 100.0f);
          }

  # publish_cover_contract_state – Veroeffentlicht Cover-Status auf .../state (retain)
  #   Ruft sync_cover_position auf
  #   Topic: smarthome/device/{device_id}/state
  #   Payload: {device_id, cover_state, cover_calibrated, fault, optional cover_position}
  #   Parameter: keine  |  Rückgabe: keine
  - id: publish_cover_contract_state
    then:
      - script.execute: sync_cover_position
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["cover_state"] = id(cover_contract_state).c_str();
            root["cover_calibrated"] = id(cover_contract_calibrated);
            root["fault"] = id(contract_fault);
            if (id(cover_contract_calibrated)) {
              root["cover_position"] = id(cover_contract_position);
            }

  # start_cover_calibration – State-Machine: Fuehrt Kalibrierung Schritt für Schritt aus
  #   Phase 0 → Phase 1: Werte zurücksetzen, Hochfahrt starten
  #   Phase 2 (up gemessen) → wartet auf erneutes calibrate
  #   Phase 2 (up gemessen & erneut calibrate) → Phase 3: Runterfahrt starten
  #   Phase 4 → finish_cover_calibration: Zeiten speichern
  #   Phase 5 → Hinweis: bereits kalibriert
  #   Parameter: keine  |  Rückgabe: keine
  - id: start_cover_calibration
    then:
      # Prueft ob Kalibrierung im Ruhezustand ist (Phase 0) → startet Hochfahrt
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 0;'
          then:
            - lambda: |-
                id(cover_calib_phase) = 1;
                id(cover_calib_up_measured) = false;
                id(cover_calib_temp_up_ms) = 0;
                id(cover_calib_temp_down_ms) = 0;
                id(cover_contract_calibrated) = false;
                id(contract_fault) = false;
                id(cover_calib_start_ms) = millis();
                ESP_LOGI("calib", "Cover calibration started - moving up");
            - script.execute: cover_hw_open
      # Prueft ob Cover oben ist, aber noch keine Hochfahrt gemessen wurde (Phase 2, kein up-Measurement)
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 2 && !id(cover_calib_up_measured);'
          then:
            - lambda: |-
                ESP_LOGI("calib", "Cover calibration phase 2 - send calibrate again after reaching top");
      # Prueft ob Hochfahrt gemessen wurde (Phase 2, up_measured=true) → startet Runterfahrt
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 2 && id(cover_calib_up_measured);'
          then:
            - lambda: |-
                id(cover_calib_phase) = 3;
                id(cover_calib_start_ms) = millis();
                ESP_LOGI("calib", "Cover calibration - moving down");
            - script.execute: cover_hw_close
      # Prueft ob Runterfahrt gemessen wurde (Phase 4) → speichert Kalibrierung
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 4;'
          then:
            - script.execute: finish_cover_calibration
      # Prueft ob Kalibrierung bereits abgeschlossen ist (Phase 5) → Hinweis ausgeben
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 5;'
          then:
            - lambda: |-
                ESP_LOGI("calib", "Cover already calibrated. Use clear_calibration first to recalibrate.");

  # handle_calib_stop – Wird bei STOP während Kalibrierung aufgerufen
  #   Phase 1: berechnet elapsed=millis()-startMillis → prueft 2000-180000ms → speichert up-Zeit → Phase 2
  #   Phase 3: berechnet elapsed → prueft 2000-180000ms → speichert down-Zeit → Phase 4
  #   Ungueltige Zeiten (<2000 oder >180000ms): zurueck zu Phase 0 (Fehler)
  #   Parameter: keine  |  Rückgabe: keine
  - id: handle_calib_stop
    then:
      - lambda: |-
          // Prueft ob wir in Phase 1 sind (Hochfahrt-Messung)
          if (id(cover_calib_phase) == 1) {
            unsigned long elapsed = millis() - (unsigned long)id(cover_calib_start_ms);
            // Prueft ob Fahrzeit im gueltigen Bereich liegt (2s-180s)
            if (elapsed >= 2000 && elapsed <= 180000) {
              id(cover_calib_temp_up_ms) = (int)elapsed;
              id(cover_calib_up_measured) = true;
              id(cover_calib_phase) = 2;
              ESP_LOGI("calib", "Up travel measured: %d ms. Send calibrate to continue.", (int)elapsed);
            } else {
              // Ungueltige Fahrzeit: Kalibrierung abbrechen (Phase 0)
              ESP_LOGW("calib", "Invalid up travel time: %d ms (need 2000-180000)", (int)elapsed);
              id(cover_calib_phase) = 0;
            }
          // Prueft ob wir in Phase 3 sind (Runterfahrt-Messung)
          } else if (id(cover_calib_phase) == 3) {
            unsigned long elapsed = millis() - (unsigned long)id(cover_calib_start_ms);
            // Prueft ob Fahrzeit im gueltigen Bereich liegt (2s-180s)
            if (elapsed >= 2000 && elapsed <= 180000) {
              id(cover_calib_temp_down_ms) = (int)elapsed;
              id(cover_calib_phase) = 4;
              ESP_LOGI("calib", "Down travel measured: %d ms. Send calibrate to save.", (int)elapsed);
            } else {
              // Ungueltige Fahrzeit: Kalibrierung abbrechen (Phase 0)
              ESP_LOGW("calib", "Invalid down travel time: %d ms (need 2000-180000)", (int)elapsed);
              id(cover_calib_phase) = 0;
            }
          }

  # finish_cover_calibration – Speichert gemessene Fahrzeiten dauerhaft
  #   Setzt travel_up_ms/travel_down_ms auf gemessene Werte
  #   Setzt calibrated=true, phase=5, position=100 (ganz offen)
  #   Parameter: keine  |  Rückgabe: keine
  - id: finish_cover_calibration
    then:
      - lambda: |-
          // Prueft ob beide Fahrzeiten gueltig sind (>= 2000ms)
          if (id(cover_calib_temp_up_ms) >= 2000 && id(cover_calib_temp_down_ms) >= 2000) {
            id(cover_contract_travel_up_ms) = id(cover_calib_temp_up_ms);
            id(cover_contract_travel_down_ms) = id(cover_calib_temp_down_ms);
            id(cover_contract_calibrated) = true;
            id(cover_contract_position) = 100;
            id(cover_calib_phase) = 5;
            ESP_LOGI("calib", "Calibration saved: up=%d ms, down=%d ms",
              id(cover_contract_travel_up_ms),
              id(cover_contract_travel_down_ms));
            id(publish_cover_contract_state).execute();
          } else {
            // Ungueltige Messwerte: Kalibrierung abbrechen
            ESP_LOGW("calib", "Calibration failed: invalid travel times");
            id(cover_calib_phase) = 0;
          }

  # clear_cover_calibration – Setzt Kalibrierung auf Default-Werte zurueck
  #   calibrated=false, travel-Zeiten=30000ms Default, phase=0
  #   Parameter: keine  |  Rückgabe: keine
  - id: clear_cover_calibration
    then:
      - lambda: |-
          id(cover_contract_calibrated) = false;
          id(cover_contract_travel_up_ms) = 30000;
          id(cover_contract_travel_down_ms) = 30000;
          id(cover_calib_phase) = 0;
          id(cover_calib_up_measured) = false;
          id(cover_calib_temp_up_ms) = 0;
          id(cover_calib_temp_down_ms) = 0;
          ESP_LOGI("calib", "Cover calibration cleared");
      - script.execute: publish_cover_contract_state

# =============================================================================
# MQTT – Kommando-Handler für Cover
# =============================================================================
mqtt:
  on_json_message:
    - topic: smarthome/device/${device_id}/command
      then:
        - lambda: |-
            // request_id aus JSON extrahieren und validieren
            // Fehlende request_id → Fehler -20 "missing_request_id"
            std::string request_id = "";
            // Prueft ob "request_id"-Schluessel im JSON vorhanden und nicht null ist
            if (x.containsKey("request_id") && !x["request_id"].isNull()) {
              request_id = x["request_id"].as<std::string>();
            }

            // Prueft ob request_id leer ist → Fehler zurueckgeben, Kommando ignorieren
            if (request_id.empty()) {
              id(contract_fault) = true;
              id(contract_last_status_code) = -20;
              id(contract_last_status_text) = "missing_request_id";
              ESP_LOGW("contract", "Ignoring cover command without request_id");
              return;
            }

            // command aus JSON extrahieren
            std::string command = "";
            // Prueft ob "command"-Schluessel im JSON vorhanden und nicht null ist
            if (x.containsKey("command") && !x["command"].isNull()) {
              command = x["command"].as<std::string>();
            }

            // queue_ack – Hilfsfunktion zum Senden einer standardisierten ACK-Antwort
            // Parameter: status(const char*), status_code(int), source(const char*)
            auto queue_ack = [&](const char *status, int status_code, const char *source) {
              id(ack_request_id) = request_id;
              id(ack_status) = status;
              id(ack_status_code) = status_code;
              id(ack_source) = source;
              id(flush_command_ack).execute();
            };

            // "get_state" – Fehler loeschen, aktuellen Status publishen, ACK=ok
            if (command == "get_state") {
              id(clear_contract_fault).execute();
              id(publish_cover_contract_state).execute();
              queue_ack("ok", 0, "esphome_state");
              return;
            }

            // "calibrate" – Kalibrierung starten oder fortsetzen
            // Phase 1 oder 3: Kalibrierung laeuft bereits → Fehler "calib_in_progress"
            // Phase 5: bereits kalibriert → Fehler "already_calibrated"
            if (command == "calibrate") {
              // Prueft ob Kalibrierung bereits laeuft (Phase 1=hoch, Phase 3=runter)
              if (id(cover_calib_phase) == 1 || id(cover_calib_phase) == 3) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -6;
                id(contract_last_status_text) = "calib_in_progress";
                queue_ack("calib_in_progress", -6, "esphome_validation");
                return;
              }
              // Prueft ob Kalibrierung bereits abgeschlossen ist (Phase 5)
              if (id(cover_calib_phase) == 5) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -6;
                id(contract_last_status_text) = "already_calibrated";
                queue_ack("already_calibrated", -6, "esphome_validation");
                return;
              }
              id(clear_contract_fault).execute();
              id(start_cover_calibration).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // "clear_calibration" – Kalibrierung zurücksetzen
            if (command == "clear_calibration") {
              id(clear_cover_calibration).execute();
              id(clear_contract_fault).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // "open" – Prüft ob Kalibrierung laeuft, startet Aufwaertsfahrt
            if (command == "open") {
              // Prueft ob Kalibrierung aktiv ist – dann open sperren
              if (id(cover_calib_phase) == 1 || id(cover_calib_phase) == 3) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -6;
                id(contract_last_status_text) = "calib_in_progress";
                queue_ack("calib_in_progress", -6, "esphome_validation");
                return;
              }
              id(cover_hw_open).execute();
              id(clear_contract_fault).execute();
              id(cover_contract_state) = "opening";
              id(publish_cover_contract_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // "close" – Prüft ob Kalibrierung laeuft, startet Abwaertsfahrt
            if (command == "close") {
              // Prueft ob Kalibrierung aktiv ist – dann close sperren
              if (id(cover_calib_phase) == 1 || id(cover_calib_phase) == 3) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -6;
                id(contract_last_status_text) = "calib_in_progress";
                queue_ack("calib_in_progress", -6, "esphome_validation");
                return;
              }
              id(cover_hw_close).execute();
              id(clear_contract_fault).execute();
              id(cover_contract_state) = "closing";
              id(publish_cover_contract_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // "stop" – Cover anhalten, ggf. Kalibrier-Messung abschliessen
            if (command == "stop") {
              // Prueft ob Kalibrierung aktiv ist – dann Stop mit Kalibrier-Auswertung
              if (id(cover_calib_phase) == 1 || id(cover_calib_phase) == 3) {
                id(cover_hw_stop).execute();
                id(handle_calib_stop).execute();
                id(cover_contract_state) = "stopped";
                id(clear_contract_fault).execute();
                id(publish_cover_contract_state).execute();
                queue_ack("ok", 0, "esphome_command");
                return;
              }
              // Normales Stop (ohne Kalibrierung)
              id(cover_hw_stop).execute();
              id(clear_contract_fault).execute();
              id(cover_contract_state) = "stopped";
              id(publish_cover_contract_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // "set_position" – Position anfahren (0-100%)
            // Akzeptiert "position" oder "value" als Feldname
            // Prüft Kalibrierung für Intermediate-Positionen (>0 und <100)
            // target=0 → close, target=100 → open, sonst Teilzeit-Berechnung
            if (command == "set_position") {
              // Prueft ob Kalibrierung aktiv ist – dann set_position sperren
              if (id(cover_calib_phase) == 1 || id(cover_calib_phase) == 3) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -6;
                id(contract_last_status_text) = "calib_in_progress";
                queue_ack("calib_in_progress", -6, "esphome_validation");
                return;
              }

              bool position_ok = false;
              int target_position = -1;

              // Prueft ob "position"-Schluessel im JSON vorhanden ist
              if (x.containsKey("position") && !x["position"].isNull()) {
                // Prueft ob "position" ein Integer ist
                if (x["position"].is<int>()) {
                  target_position = x["position"].as<int>();
                  position_ok = true;
                }
              // Prueft alternativ ob "value"-Schluessel vorhanden ist (Kompatibilitaet)
              } else if (x.containsKey("value") && !x["value"].isNull()) {
                // Prueft ob "value" ein Integer ist
                if (x["value"].is<int>()) {
                  target_position = x["value"].as<int>();
                  position_ok = true;
                }
              }

              // Prueft ob Position ungueltig ist (kein Wert, <0 oder >100) → Fehler -21
              if (!position_ok || target_position < 0 || target_position > 100) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -21;
                id(contract_last_status_text) = "invalid_payload";
                queue_ack("invalid_payload", -21, "esphome_validation");
                return;
              }

              // Intermediate-Position (1-99%) erfordert Kalibrierung
              if (!id(cover_contract_calibrated) && target_position > 0 && target_position < 100) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -5;
                id(contract_last_status_text) = "not_calibrated";
                queue_ack("not_calibrated", -5, "esphome_validation");
                return;
              }

              id(clear_contract_fault).execute();
              id(cover_contract_target_position) = target_position;

              // Ziel 0 = ganz schliessen (Position 0%)
              if (target_position == 0) {
                id(cover_hw_close).execute();
                id(cover_contract_state) = "closing";
              // Ziel 100 = ganz oeffnen (Position 100%)
              } else if (target_position == 100) {
                id(cover_hw_open).execute();
                id(cover_contract_state) = "opening";
              // Intermediate-Position: Teilfahrt mit Zeitberechnung
              } else {
                id(sync_cover_position).execute();
                // Prueft ob Ziel ueber aktueller Position → aufwaerts
                if (target_position > id(cover_contract_position)) {
                  id(cover_contract_state) = "opening";
                // Prueft ob Ziel unter aktueller Position → abwaerts
                } else if (target_position < id(cover_contract_position)) {
                  id(cover_contract_state) = "closing";
                } else {
                  // Ziel = aktuell: nichts tun
                  id(cover_contract_state) = "stopped";
                }
                id(cover_hw_set_position).execute(target_position);
              }

              id(publish_cover_contract_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // Fallback: unbekanntes Kommando → Fehler -2 "unsupported"
            id(contract_fault) = true;
            id(contract_last_status_code) = -2;
            id(contract_last_status_text) = "unsupported";
            queue_ack("unsupported", -2, "esphome_validation");
