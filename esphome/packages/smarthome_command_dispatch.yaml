# =============================================================================
# smarthome_command_dispatch.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – alternative MQTT-Linie
# Zweck:      Gemeinsamer Command-Dispatch-Baustein fuer alle ESPHome-Geraete
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       packages/smarthome_command_dispatch.yaml
#
# Datei-Funktion:
#   Stellt die gemeinsam genutzte Command-Verarbeitung bereit, die bisher in
#   jedem Device-YAML dupliziert war. Extrahiert request_id-Parsing,
#   queue_ack-Lambda, get_state-Behandlung und master_mac-Validierung.
#   Geraetespezifische Handler (set_relay, calibrate, open, close, stop,
#   set_position) werden ueber device-spezifische Skripte eingebunden.
#
# Verwendung:
#   Jedes Device-YAML inkludiert dieses Package und implementiert:
#   - script: handle_device_command(command, x)  – geraetespezifische Commands
#   - script: publish_device_state               – State publizieren
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-24
# Letzte Änderung: 2026-05-24
#
# Aenderungshistorie:
#   [2026-05-24] DevOpsOfChaos – Extraktion aus dupliziertem Device-Code
#
# Abhaengigkeiten:
#   Wird importiert von: Device-Dateien
#   Importiert selbst:   smarthome_contract_base.yaml, smarthome_command_ack.yaml
# =============================================================================

# =============================================================================
# SKRIPTE – Gemeinsame Command-Verarbeitung
# =============================================================================
script:
  # validate_and_store_master_mac – Validiert und speichert eine master_mac
  #   Eingabe: values ist ein JsonObjectConst aus set_config
  #   Rueckgabe: setzt globale Variablen dispatch_mac_changed, dispatch_mac_invalid
  #   Parameter: keine (nutzt x aus dem umgebenden Lambda-Kontext)
  #   Die MAC muss 17 Zeichen lang sein (XX:XX:XX:XX:XX:XX).
  - id: validate_and_store_master_mac
    then:
      - lambda: |-
          // Validiert MAC-Adresse im Format XX:XX:XX:XX:XX:XX (17 Zeichen).
          // Hex-Pruefung: Positionen 0-1,3-4,6-7,9-10,12-13,15-16 muessen
          // Hex-Ziffern sein, Positionen 2,5,8,11,14 muessen ':' sein.
          auto is_hex = [](char c) {
            return (c >= '0' && c <= '9') || (c >= 'A' && c <= 'F') || (c >= 'a' && c <= 'f');
          };
          bool valid = master_mac.length() == 17;
          for (size_t i = 0; valid && i < master_mac.length(); i++) {
            if ((i + 1) % 3 == 0) valid = master_mac[i] == ':';
            else valid = is_hex(master_mac[i]);
          }
          if (valid) {
            id(stored_master_mac) = master_mac;
            id(setup_master_mac_text).publish_state(master_mac);
          }
