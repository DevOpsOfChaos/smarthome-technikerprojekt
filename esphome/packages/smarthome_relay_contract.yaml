# =============================================================================
# smarthome_relay_contract.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – ESPHome-Zweitlinie
# Zweck:      MQTT-basierte Alternativ-Firmware für Smarthome-Geraete
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       esphome/packages/smarthome_relay_contract.yaml
#
# Datei-Funktion:
#   Relais-Contract zum Schalten eines einzelnen Relais (ein/aus).
#   Stellt das MQTT-Topic .../state für den aktuellen Relais-Status
#   und .../command für die Kommandos "get_state" und "set_relay" bereit.
#   set_relay akzeptiert bool, int und String-Werte (type coercion).
#
# MQTT-Topics dieses Contracts:
#   smarthome/device/{device_id}/state    – Relais-Status (relay_1) + Fehler (retain)
#   smarthome/device/{device_id}/command  – Eingehende Kommandos (set_relay, get_state)
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-14
# Letzte Änderung: 2026-05-14
#
# Aenderungshistorie:
#   [2026-05-14] DevOpsOfChaos – Initiale Erstellung
#
# Abhaengigkeiten:
#   Importiert:    smarthome_contract_base.yaml, smarthome_command_ack.yaml
#   Wird importiert von: esp_net_erl_light_example.yaml
# =============================================================================

# =============================================================================
# GLOBAL – Relais-Zustand
# =============================================================================
globals:
  - id: relay_1_state                # true = Relais EIN, false = Relais AUS
    type: bool
    restore_value: no
    initial_value: "false"

# =============================================================================
# SKRIPTE – Relais-Status publishen
# =============================================================================
script:
  # publish_relay_contract_state – Veroeffentlicht relay_1 + fault auf .../state (retain)
  #   Topic: smarthome/device/{device_id}/state
  #   Payload: {device_id, relay_1(bool), fault(bool)}
  #   Parameter: keine  |  Rückgabe: keine
  - id: publish_relay_contract_state
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/state
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["relay_1"] = id(relay_1_state);
            root["fault"] = id(contract_fault);

# =============================================================================
# MQTT – Kommando-Handler für Relais
# =============================================================================
mqtt:
  on_json_message:
    - topic: smarthome/device/${device_id}/command
      then:
        - lambda: |-
            // request_id aus JSON extrahieren
            // Prueft ob "request_id" vorhanden, sonst Fehler -20 "missing_request_id"
            std::string request_id = "";
            if (x.containsKey("request_id") && !x["request_id"].isNull()) {
              request_id = x["request_id"].as<std::string>();
            }

            if (request_id.empty()) {
              id(contract_fault) = true;
              id(contract_last_status_code) = -20;
              id(contract_last_status_text) = "missing_request_id";
              ESP_LOGW("contract", "Ignoring command without request_id");
              return;
            }

            // command aus JSON extrahieren
            std::string command = "";
            if (x.containsKey("command") && !x["command"].isNull()) {
              command = x["command"].as<std::string>();
            }

            // queue_ack – Hilfsfunktion zum Senden einer ACK-Antwort
            // Parameter: status(const char*), status_code(int), source(const char*)
            auto queue_ack = [&](const char *status, int status_code, const char *source) {
              id(ack_request_id) = request_id;
              id(ack_status) = status;
              id(ack_status_code) = status_code;
              id(ack_source) = source;
              id(flush_command_ack).execute();
            };

            // Befehl: "get_state" – Fehler loeschen, Status publishen, ACK=ok
            // Quelle=esphome_state (kein Kommando, sondern Zustandsabfrage)
            if (command == "get_state") {
              id(clear_contract_fault).execute();
              id(publish_relay_contract_state).execute();
              queue_ack("ok", 0, "esphome_state");
              return;
            }

            // Befehl: "set_relay" – Relais schalten (mit Typ-Konvertierung)
            // Akzeptiert: bool (true/false), int (1/0), string ("true"/"1"/"on" oder "false"/"0"/"off")
            // Bei ungueltigem Payload: Fehler -21 "invalid_payload"
            if (command == "set_relay") {
              bool relay_value = false;
              bool relay_value_ok = false;

              // Prueft ob "relay_1"-Schluessel im JSON-Payload vorhanden ist
              if (x.containsKey("relay_1") && !x["relay_1"].isNull()) {
                // Prueft ob der Wert ein bool ist → direkt uebernehmen
                if (x["relay_1"].is<bool>()) {
                  relay_value = x["relay_1"].as<bool>();
                  relay_value_ok = true;
                // Prueft ob der Wert ein int ist → != 0 = true
                } else if (x["relay_1"].is<int>()) {
                  relay_value = x["relay_1"].as<int>() != 0;
                  relay_value_ok = true;
                // Prueft ob der Wert ein String ist → Text parsen
                } else if (x["relay_1"].is<const char*>()) {
                  std::string relay_text = x["relay_1"].as<std::string>();
                  // Prueft auf "true"/"1"/"on" → Relais EIN
                  if (relay_text == "true" || relay_text == "1" || relay_text == "on") {
                    relay_value = true;
                    relay_value_ok = true;
                  // Prueft auf "false"/"0"/"off" → Relais AUS
                  } else if (relay_text == "false" || relay_text == "0" || relay_text == "off") {
                    relay_value = false;
                    relay_value_ok = true;
                  }
                }
              }

              // Prueft ob kein gueltiger Wert uebergeben wurde → Fehler -21
              if (!relay_value_ok) {
                id(contract_fault) = true;
                id(contract_last_status_code) = -21;
                id(contract_last_status_text) = "invalid_payload";
                queue_ack("invalid_payload", -21, "esphome_validation");
                return;
              }

              // Relais physisch schalten via ESPHome-Switch-API
              // Prueft ob Relais ein- oder ausgeschaltet werden soll
              if (relay_value) {
                id(relay_1_output).turn_on();
              } else {
                id(relay_1_output).turn_off();
              }

              // Neuen Zustand speichern und via MQTT publishen
              id(relay_1_state) = relay_value;
              id(clear_contract_fault).execute();
              id(publish_relay_contract_state).execute();
              queue_ack("ok", 0, "esphome_command");
              return;
            }

            // Fallback: unbekanntes Kommando → Fehler -2 "unsupported"
            id(contract_fault) = true;
            id(contract_last_status_code) = -2;
            id(contract_last_status_text) = "unsupported";
            queue_ack("unsupported", -2, "esphome_validation");
