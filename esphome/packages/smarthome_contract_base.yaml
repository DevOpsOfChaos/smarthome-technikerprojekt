# =============================================================================
# smarthome_contract_base.yaml
# =============================================================================
# Projekt:    Smarthome Technikerprojekt – alternative MQTT-Linie
# Zweck:      MQTT-basierte Firmware fuer Smarthome-Geraete
#             ohne ESP-NOW-Master und ohne Bridge.
# Lizenz:     Proprietär – nur für Projektzwecke
# Pfad:       packages/smarthome_contract_base.yaml
#
# Datei-Funktion:
#   Basis-Contract für alle Geraete. Stellt Meta-Daten,
#   Verfuegbarkeits-Status und Fehlerbehandlung bereit.
#   Wird von jedem Device-Code über !include eingebunden.
#   Enthaelt keine geraetespezifische Logik.
#
# MQTT-Topics dieses Contracts:
#   smarthome/device/{device_id}/meta         – Geraete-Metadaten (retain)
#   smarthome/device/{device_id}/availability – Online/Offline-Status (retain)
#
# Autor:           DevOpsOfChaos
# Erstelldatum:    2026-05-14
# Letzte Änderung: 2026-05-14
#
# Aenderungshistorie:
#   [2026-05-14] DevOpsOfChaos – Initiale Erstellung
#
# Abhaengigkeiten:
#   Wird importiert von: Device-Dateien
#   Importiert selbst:   (keine – reines Basis-Package)
# =============================================================================

# =============================================================================
# SUBSTITUTIONS – Geraetekonfiguration (wird pro Device ueberschrieben)
# =============================================================================
substitutions:
  device_id: device_template               # Eindeutige MQTT-Geraete-ID (z.B. NET-ERL-010)
  device_name: Smarthome Template Device   # Anzeigename für Home Assistant / MQTT
  device_class: net_erl                    # Geraeteklasse: net_erl=Relais, net_sen=Sensor, net_zrl=Cover, bat_sen=Batterie
  power_type: mains                        # Stromversorgung: mains (Netz) oder battery (Batterie)
  fw_version: "0"                         # Firmware-Version für Meta-Report
  caps: "0"                               # Faehigkeiten als Bitmaske (Bit 0=Relais, 1=Temp, 2=Feuchte, 3=Druck, 4=Gas, 6=Lux, 7=Fensterkontakt, 8-9=Regen)
  mac_address: ""                         # MAC-Adresse, falls sie explizit gesetzt wird
  meta_schema_version: "1"                # Version des Meta-Daten-Schemas
  control_mode: none                      # Steuerungsmodus: none, relay_light, cover, …
  config_profile: none                    # Konfigurationsprofil
  reporting_mode: hybrid                  # Report-Modus: hybrid (Netzgeraete), sleep_event (Batterie)
  sensor_mask: XXXXXXXXXX                 # 10-stellige Sensormaske: T(emp)peratur, H(um)Feuchte, P(ressure)Druck, G(as), L(ux)Licht, W(indow)Fensterkontakt, R(ain)Regen
  input_mask: XXXXX                       # 5-stellige Eingangsmaske (Reserve)

# =============================================================================
# OTA – Wireless-Update-Dienst fuer alle ESPHome-Geraete
# =============================================================================
ota:
  - platform: esphome
    password: !secret ota_password

# =============================================================================
# GLOBALE VARIABLEN – Contract-uebergreifende Zustaende
# =============================================================================
globals:
  - id: contract_online                   # true = Geraet ist mit MQTT-Broker verbunden
    type: bool
    restore_value: no
    initial_value: "false"
  - id: contract_fault                    # true = es liegt ein Fehler vor (z.B. unbekannter Befehl, fehlende request_id)
    type: bool
    restore_value: no
    initial_value: "false"
  - id: contract_last_status_code         # Letzter Statuscode (0=ok, negative Werte=Fehler)
    type: int
    restore_value: no
    initial_value: "0"
  - id: contract_last_status_text         # Letzter Statustext (z.B. "ok", "unsupported", "missing_request_id")
    type: std::string
    restore_value: no
    initial_value: '"ok"'
  - id: contract_last_request_id          # request_id des zuletzt verarbeiteten Kommandos
    type: std::string
    restore_value: no
    initial_value: '""'

# =============================================================================
# SKRIPTE – Hilfsfunktionen für diesen Contract
# =============================================================================
script:
  # clear_contract_fault – Setzt den Fehlerstatus zurueck
  #   Setzt contract_fault=false, status_code=0, status_text="ok"
  #   Parameter: keine  |  Rückgabe: keine
  - id: clear_contract_fault
    then:
      - lambda: |-
          id(contract_fault) = false;
          id(contract_last_status_code) = 0;
          id(contract_last_status_text) = "ok";

  # publish_contract_meta – Veroeffentlicht Geraete-Metadaten via MQTT (retain)
  #   Topic:   smarthome/device/{device_id}/meta
  #   Payload: JSON mit device_id, device_name, device_class, power_type,
  #            fw_version, caps, meta_schema_version, control_mode,
  #            config_profile, reporting_mode, sensor_mask, input_mask
  #   Parameter: keine  |  Rückgabe: keine
  - id: publish_contract_meta
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/meta
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["device_name"] = "${device_name}";
            root["device_class"] = "${device_class}";
            root["power_type"] = "${power_type}";
            const char *fw_version_text = "${fw_version}";
            bool fw_version_is_numeric = fw_version_text[0] != '\0';
            for (const char *p = fw_version_text; *p != '\0'; p++) {
              if (*p < '0' || *p > '9') {
                fw_version_is_numeric = false;
                break;
              }
            }
            if (fw_version_is_numeric) root["fw_version"] = atoi(fw_version_text);
            else root["fw_version"] = fw_version_text;
            root["caps"] = atoi("${caps}");
            root["mac_address"] = "${mac_address}";
            root["meta_schema_version"] = atoi("${meta_schema_version}");
            root["control_mode"] = "${control_mode}";
            root["config_profile"] = "${config_profile}";
            root["reporting_mode"] = "${reporting_mode}";
            root["sensor_mask"] = "${sensor_mask}";
            root["input_mask"] = "${input_mask}";

  # publish_contract_availability – Veroeffentlicht Online/Offline-Status via MQTT (retain)
  #   Topic:   smarthome/device/{device_id}/availability
  #   Payload: JSON mit device_id, availability("online"/"offline"), online(bool), power_type
  #   Parameter: keine  |  Rückgabe: keine
  - id: publish_contract_availability
    then:
      - mqtt.publish_json:
          topic: smarthome/device/${device_id}/availability
          retain: true
          payload: |-
            root["device_id"] = "${device_id}";
            root["availability"] = id(contract_online) ? "online" : "offline";
            root["online"] = id(contract_online);
            root["power_type"] = "${power_type}";
